



<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://totaljerkface.com https://www.totaljerkface.com http://www.totaljerkface.com">
    <script src="./portable-bootstrap.js"></script>

    <style>
        body {
            overflow: hidden;
            background-color: #3d88c7;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <script>
        (function() {
            function getTitleLabel() {
                var labels = [
                    "JS Edition",
                    "HTML5 Edition",
                    "Flashless Version",
                    "RIP Flash Edition",
                    "Flash Is Dead!",
                    "Farewell Flash...",
                    "Without that plugin",
                    "Does Jim know I put this here?"
                ]
                return labels[Math.floor(Math.random() * labels.length)];
            }

            function get_latest_hw_version() {
                return fetch("./version.json")
                .then(function(response) { return response.json(); })
                .catch(function(error) {
                    throw error;
                });
            }

            function retryOnError(safemode)
            {
                if (safemode)
                {
                    const urlParams = new URLSearchParams(window.location.search);
                    urlParams.set("s", "on");
                    window.location.search = urlParams;
                }

                setTimeout(window.location.reload.bind(window.location), (Math.random() * 4000) + 3000);
            }


            window["HW_SETTINGS"] = {
                "siteURL": "https://totaljerkface.com/",
                "pathPrefix": '',
                "titleLabel": getTitleLabel(),
                "titleLabelX": 645,
                "titleLabelY": 250,
                "titleLabelRotation": 0,
                "titleLabelSize": 20,
                "titleLabelColor": 0xfdfd65,
                "resolutionZoomIncreaseRatio": 0.5,
                "tesselation": "tess2",
            };

        const guardedglobalnames = [
            "focus",
            "scrollTo",
            "requestAnimationFrame",
            "cancelAnimationFrame",
            "setTimeout",
            "clearTimeout",
            "setInterval",
            "clearInterval",
            "performance",
            "HW_SETTINGS",
            "localStorage",
            "sessionStorage"
        ];
        for (const name of guardedglobalnames) {
            const descriptor = Object.getOwnPropertyDescriptor(window, name);
            if (!descriptor) {
                continue;
            }
            if ("writable" in descriptor) {
                descriptor.writable = false;
            }
            descriptor.configurable = false;
            try {
                Object.defineProperty(window, name, descriptor);
            } catch (error) {}
        }


                const urlParams = new URLSearchParams(window.parent.location.search);
                const replayId = urlParams.get("replay_id");
                const levelId = urlParams.get("level_id");
                if(replayId !== null && replayId !== "" && !isNaN(replayId)) {
                    window["HW_SETTINGS"]["replay_id"] = replayId;
                }
                if(levelId !== null && levelId !== "" && !isNaN(levelId)) {
                    window["HW_SETTINGS"]["level_id"] = levelId;
                }

                // Object.freeze(window["HW_SETTINGS"]);

                const loadDependency = (name, hash, safemode) => {
                    var d_el = document.createElement("script");
                    let d_src = "./js/" + name + "." + hash + ".js";
                    d_el.async = false;
                    if (safemode)
                    {
                        d_src += "?x=" + Math.random();
                    }
                    d_el.src = d_src;
                    d_el.defer = "defer";
                    d_el.onerror = () => retryOnError(true);
                    document.body.appendChild(d_el);
                }

                const safemodeEnabled = false;//new URLSearchParams(window.location.search).get("s") === "on";
                try {
                    get_latest_hw_version().then(function(latest) {
                        loadDependency("dependencies", latest["dependencies"], safemodeEnabled);
                        loadDependency("index", latest["index"], safemodeEnabled);
                    })
                    .catch(function(error) {
                        retryOnError();
                    });
                } catch(e) {
                    retryOnError();
                }
        })();
    </script>

    <div id="og-game-holder"></div>
</body>
</html>
